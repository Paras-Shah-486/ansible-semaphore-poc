---
- name: Install nginx
  dnf:
    name: nginx
    state: present

- name: Deploy webpage
  template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
  notify:
    - Restart nginx

- name: Enable nginx
  service:
    name: nginx
    enabled: true

- name: Start nginx
  service:
    name: nginx
    state: started
