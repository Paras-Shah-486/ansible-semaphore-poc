---
- name: Weekly Health Check
  hosts: webservers
  become: true
  tasks:
    - name: Check nginx status
      shell: systemctl is-active nginx
      register: nginx_status
      failed_when: false
      changed_when: false
    - debug:
        var: nginx_status.stdout

    - name: Check disk utilization
      shell: df -h /
      register: disk_usage
      changed_when: false
    - debug:
        var: disk_usage.stdout_lines

    - name: Check uptime
      shell: uptime
      register: uptime_info
      changed_when: false
    - debug:
        var: uptime_info.stdout
